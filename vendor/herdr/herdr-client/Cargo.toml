[package]
name = "herdr-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false
description = "Herdr's native client library, vendored for MonoTerm"

[features]
# `ConnectTarget::Cloud`: machines a cloud provider created, reached through an
# application-built command. Each provider adds its `CloudProvider` variant.
cloud = []
azure = ["cloud"]
boat = ["cloud"]
coder = ["cloud"]
container = ["cloud"]
daytona = ["cloud"]
opensandbox = ["cloud"]
railway = ["cloud"]
sprites = ["cloud"]
# `login_env::probe_for_tests`, for tests that start from a bare desktop
# environment.
test-support = []

[dependencies]
base64 = "0.23.1"
crossbeam-channel = "0.5"
herdr-protocol = { path = "../herdr-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["event", "fs", "process", "pty", "termios"] }

# The Windows daemon binds a named pipe, not an AF_UNIX socket; `interprocess`
# maps a socket path into the NPFS namespace exactly as upstream Herdr does.
[target.'cfg(windows)'.dependencies]
interprocess = "2.4.2"
windows-sys = { version = "0.61.2", features = [
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Threading",
] }

# `login_env`'s tests bind a socket that never listens.
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "=0.31.3", features = ["socket", "term", "user"] }
