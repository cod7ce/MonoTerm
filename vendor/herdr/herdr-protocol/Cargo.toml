[package]
name = "herdr-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false
description = "Herdr's generation 1 wire model, vendored for MonoTerm"

[dependencies]
base64 = "0.23.1"
bincode = { version = "2", default-features = false, features = ["serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
